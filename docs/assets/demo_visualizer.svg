<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Vectors & Lighting Gradients -->
    <linearGradient id="aiVec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="safeVec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <radialGradient id="robotBody" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </radialGradient>
    <radialGradient id="obsA" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="60%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </radialGradient>
    <radialGradient id="obsB" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="60%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#831843" />
    </radialGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="630" fill="url(#bgCanvas)" rx="20" stroke="#1e293b" stroke-width="2"/>

  <!-- High-Tech Coordinate Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#gridPattern)" />
  </g>

  <!-- Top Glassmorphic Navigation Bar -->
  <rect x="25" y="20" width="1150" height="64" rx="14" fill="url(#glassCard)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
  
  <g transform="translate(45, 34)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#0284c7" opacity="0.2"/>
    <text x="18" y="26" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle">⚡</text>
    <text x="50" y="25" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1.5">
      PRINCIPIA ROBOTICA <tspan fill="#38bdf8" font-size="14" font-weight="600">v1.0.0</tspan>
    </text>
    <text x="50" y="40" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
      Deterministic CBF-QP Safety Interceptor Gateway for Embodied AI &amp; ROS 2
    </text>
  </g>

  <g transform="translate(860, 36)">
    <!-- Badges -->
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#34d399"/>
    <text x="30" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ecfdf5">100% INVARIANT</text>

    <rect x="140" y="0" width="140" height="32" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="210" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff" text-anchor="middle">&gt;12,000 Hz LOOP</text>
  </g>

  <!-- MAIN SIMULATION RADAR VIEW (Left Stage) -->
  <rect x="25" y="100" width="760" height="505" rx="16" fill="#030712" stroke="#1e293b" stroke-width="2" filter="url(#dropShadow)"/>

  <!-- Radar Distance Rings (Concentric Iso-Barrier Curves) -->
  <g opacity="0.25">
    <circle cx="280" cy="350" r="120" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="280" cy="350" r="220" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="6,6"/>
    <circle cx="280" cy="350" r="320" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="8,8"/>
    <line x1="280" y1="50" x2="280" y2="580" stroke="#0284c7" stroke-width="1" stroke-dasharray="2,4"/>
    <line x1="25" y1="350" x2="785" y2="350" stroke="#0284c7" stroke-width="1" stroke-dasharray="2,4"/>
  </g>

  <!-- Obstacle A: Static Invariant Safety Barrier -->
  <g transform="translate(560, 350)">
    <!-- Outer Safe Margin Zone h(x) = 0 -->
    <circle cx="0" cy="0" r="145" fill="#f43f5e" fill-opacity="0.04" stroke="#f43f5e" stroke-width="2" stroke-dasharray="8,6" filter="url(#glowRed)"/>
    <!-- Velocity Repulsion Iso-Gradient Field -->
    <circle cx="0" cy="0" r="105" fill="#e11d48" fill-opacity="0.12" stroke="#fb7185" stroke-width="1.5"/>
    <!-- Physical Solid Core -->
    <circle cx="0" cy="0" r="65" fill="url(#obsA)" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)"/>
    <text x="0" y="-5" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">OBSTACLE 01</text>
    <text x="0" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fecdd3" text-anchor="middle">R = 0.50 m</text>
    <text x="0" y="170" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle">
      Barrier Boundary: h₁(x) = ‖p - p_obs‖² - R_safe² = 0
    </text>
  </g>

  <!-- Obstacle B: Secondary Constraint -->
  <g transform="translate(480, 180)">
    <circle cx="0" cy="0" r="75" fill="#ec4899" fill-opacity="0.05" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="40" fill="url(#obsB)" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="4" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">OBS 02</text>
  </g>

  <!-- Vector Representation & Physics Actuation -->
  <!-- 1. Unsafe AI Proposing Trajectory (Green Dashed Line into Wall) -->
  <path d="M 280 350 L 500 350" fill="none" stroke="url(#aiVec)" stroke-width="4.5" stroke-dasharray="8,5" filter="url(#glowGreen)"/>
  <polygon points="495,342 515,350 495,358" fill="#4ade80"/>
  <rect x="305" y="316" width="180" height="26" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
  <text x="395" y="333" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">
    u_AI = [1.20 m/s, 0.00 r/s] (CRASH)
  </text>

  <!-- 2. Deterministic Safe Trajectory (Curved Blue Gradient Arc via Lie Derivative) -->
  <path d="M 280 350 C 370 350, 420 280, 430 190" fill="none" stroke="url(#safeVec)" stroke-width="6" stroke-linecap="round" filter="url(#glowCyan)"/>
  <polygon points="420,195 432,175 440,195" fill="#38bdf8"/>
  <rect x="290" y="240" width="220" height="28" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" filter="url(#dropShadow)"/>
  <text x="400" y="259" font-family="'Fira Code', monospace" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">
    u* = [0.22 m/s, +0.94 r/s] (OPTIMAL)
  </text>

  <!-- Robot Chassis Body (Differential Drive Autonomous AGV) -->
  <g transform="translate(280, 350)">
    <!-- Safe Footprint Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Robot Hull -->
    <circle cx="0" cy="0" r="32" fill="url(#robotBody)" stroke="#93c5fd" stroke-width="3" filter="url(#dropShadow)"/>
    <!-- Wheels -->
    <rect x="-14" y="-36" width="28" height="8" rx="3" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="-14" y="28" width="28" height="8" rx="3" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Lidar Puck & Heading Sensor -->
    <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="0" x2="26" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="26" cy="0" r="3" fill="#38bdf8"/>
    <!-- Tag -->
    <text x="0" y="56" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">ROBOT (x₀, y₀)</text>
  </g>

  <!-- Canvas HUD Legend Bar -->
  <g transform="translate(45, 565)">
    <rect x="0" y="0" width="720" height="30" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="20" cy="15" r="5" fill="#4ade80"/>
    <text x="32" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Unsafe AI Intent (u_AI)</text>
    
    <circle cx="210" cy="15" r="5" fill="#38bdf8"/>
    <text x="222" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">KKT Safe Filtered (u*)</text>

    <circle cx="400" cy="15" r="5" fill="#f43f5e"/>
    <text x="412" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Barrier Set Invariance h(x)=0</text>

    <text x="695" y="19" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="end">60 FPS LIVE KINEMATICS</text>
  </g>

  <!-- RIGHT TELEMETRY & CONTROL PANEL (Engineering Dashboard) -->
  <g transform="translate(805, 100)">
    <rect x="0" y="0" width="370" height="505" rx="16" fill="url(#glassCard)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>

    <text x="24" y="36" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      REAL-TIME CBF-QP TELEMETRY
    </text>
    <text x="24" y="54" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#64748b">
      Ames et al. Lie Derivative Verification
    </text>
    <line x1="24" y1="66" x2="346" y2="66" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Module Card 1: Barrier Status -->
    <g transform="translate(20, 78)">
      <rect x="0" y="0" width="330" height="74" rx="10" fill="#030712" stroke="#059669" stroke-width="1.5"/>
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#34d399" letter-spacing="1">BARRIER METRIC h(x)</text>
      <text x="16" y="52" font-family="'Fira Code', monospace" font-size="18" font-weight="800" fill="#10b981">
        h₁(x) = +0.8427 <tspan font-size="12" font-weight="600">[SAFE ✅]</tspan>
      </text>
      <text x="315" y="50" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="end">γ = 1.0</text>
    </g>

    <!-- Module Card 2: Solver Performance -->
    <g transform="translate(20, 162)">
      <rect x="0" y="0" width="330" height="74" rx="10" fill="#030712" stroke="#1e293b"/>
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">QP SOLVE LATENCY</text>
      <text x="16" y="52" font-family="'Fira Code', monospace" font-size="20" font-weight="900" fill="#fbbf24">
        0.082 ms <tspan font-size="12" font-weight="500" fill="#94a3b8">(&gt;12,000 Hz)</tspan>
      </text>
      <circle cx="305" cy="45" r="5" fill="#fbbf24"/>
    </g>

    <!-- Module Card 3: Intercept Command Math -->
    <g transform="translate(20, 246)">
      <rect x="0" y="0" width="330" height="120" rx="10" fill="#030712" stroke="#1e293b"/>
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">MINIMUM L₂ PERTURBATION (KKT)</text>
      
      <text x="16" y="48" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#94a3b8">u_AI : </text>
      <text x="65" y="48" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#4ade80">v=1.20 m/s, ω=0.00 r/s</text>

      <text x="16" y="72" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#94a3b8">u*   : </text>
      <text x="65" y="72" font-family="'Fira Code', monospace" font-size="12" font-weight="800" fill="#38bdf8">v=0.22 m/s, ω=+0.94 r/s</text>

      <line x1="16" y1="84" x2="314" y2="84" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="104" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#c084fc">
        ‖u* - u_AI‖₂ = 1.0264 rad·m/s
      </text>
    </g>

    <!-- Module Card 4: Hardware Link Status -->
    <g transform="translate(20, 376)">
      <rect x="0" y="0" width="330" height="106" rx="10" fill="#030712" stroke="#1e293b"/>
      <text x="16" y="22" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">SYSTEMS ECOSYSTEM STATUS</text>
      
      <text x="16" y="45" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
        • ROS 2 Bridge: <tspan fill="#34d399">/cmd_vel_raw → /cmd_vel</tspan>
      </text>
      <text x="16" y="65" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
        • MCP Gateway: <tspan fill="#38bdf8">14 Tools Registered</tspan>
      </text>
      <text x="16" y="85" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
        • Core Solver: <tspan fill="#a855f7">OSQP / Pure Python Vec</tspan>
      </text>
    </g>
  </g>
</svg>
