<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="aiVecGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="safeVecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="obstacleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#e11d48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.1" />
    </radialGradient>
    
    <!-- Filters & Glow -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#bgGrad)" rx="16" stroke="#334155" stroke-width="2"/>

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="360" x2="900" y2="360"/>
    <line x1="0" y1="420" x2="900" y2="420"/>
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="18" width="860" height="48" rx="8" fill="url(#panelGrad)" stroke="#475569" stroke-width="1"/>
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
    🛡️ PRINCIPIA ROBOTICA v1.0.0 — REAL-TIME CBF-QP SAFETY FILTER VISUALIZER
  </text>
  <text x="640" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">
    60 FPS Interactive Canvas
  </text>

  <!-- Left Main Canvas Simulation Area -->
  <rect x="20" y="80" width="560" height="380" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <!-- CBF Barrier Zone (h(x) = 0) Outer Circle -->
  <circle cx="430" cy="270" r="105" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" filter="url(#glowRed)"/>
  <circle cx="430" cy="270" r="70" fill="url(#obstacleGrad)" stroke="#e11d48" stroke-width="3"/>
  <text x="430" y="265" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">OBSTACLE A</text>
  <text x="430" y="285" font-family="sans-serif" font-size="12" font-weight="600" fill="#fecdd3" text-anchor="middle">Radius: 0.50m</text>

  <text x="430" y="150" font-family="monospace" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle">
    CBF Barrier Field: h(x) = ‖p - p_obs‖² - R² = 0
  </text>

  <!-- Proposed AI Velocity Vector (Green Arrow - Unsafe Straight into Obstacle) -->
  <path d="M 160 270 L 330 270" stroke="url(#aiVecGrad)" stroke-width="4" stroke-dasharray="8,4" filter="url(#glowGreen)"/>
  <polygon points="330,264 345,270 330,276" fill="#4ade80"/>
  <text x="230" y="255" font-family="sans-serif" font-size="12" font-weight="700" fill="#4ade80">
    u_AI = [1.00 m/s, 0.00 rad/s] (Unsafe Intent)
  </text>

  <!-- Safe CBF-QP Corrected Vector (Blue Arrow - Curving Away Safely) -->
  <path d="M 160 270 Q 230 270 280 180" fill="none" stroke="url(#safeVecGrad)" stroke-width="5" filter="url(#glowBlue)"/>
  <polygon points="274,185 288,168 285,190" fill="#38bdf8"/>
  <text x="180" y="195" font-family="sans-serif" font-size="13" font-weight="800" fill="#38bdf8">
    u* = [0.15 m/s, +0.85 rad/s] (KKT Safe Intercept)
  </text>

  <!-- Robot Chassis Body -->
  <circle cx="160" cy="270" r="28" fill="url(#robotGrad)" stroke="#60a5fa" stroke-width="3"/>
  <!-- Robot Heading Line -->
  <line x1="160" y1="270" x2="185" y2="270" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="270" r="6" fill="#ffffff"/>
  <text x="160" y="315" font-family="sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">ROBOT (x=0, y=0)</text>

  <!-- Controls Banner at bottom of Canvas -->
  <rect x="35" y="415" width="530" height="32" rx="6" fill="#1e293b" opacity="0.9"/>
  <text x="50" y="436" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
    🎮 Drag Robot / Obstacles with Mouse | Live 60 FPS QP Correction Loop
  </text>

  <!-- Right Telemetry Panel -->
  <rect x="600" y="80" width="280" height="380" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="2"/>

  <text x="620" y="110" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
    📊 Real-Time Telemetry
  </text>
  <line x1="620" y1="120" x2="860" y2="120" stroke="#334155" stroke-width="1"/>

  <!-- Metric Card 1: Robot State -->
  <rect x="618" y="132" width="244" height="60" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="630" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">ROBOT POSE (x, y, θ)</text>
  <text x="630" y="176" font-family="monospace" font-size="14" font-weight="700" fill="#38bdf8">x: 0.00m  y: 0.00m  θ: 0.0°</text>

  <!-- Metric Card 2: Proposed vs Safe Vector -->
  <rect x="618" y="202" width="244" height="74" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="630" y="222" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">VELOCITY INTERCEPT</text>
  <text x="630" y="244" font-family="monospace" font-size="12" font-weight="700" fill="#4ade80">v_AI: 1.00 m/s  ω_AI: 0.00 r/s</text>
  <text x="630" y="264" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">v*  : 0.15 m/s  ω*  : 0.85 r/s</text>

  <!-- Metric Card 3: Safety Status -->
  <rect x="618" y="286" width="244" height="60" rx="6" fill="#0f172a" stroke="#059669"/>
  <text x="630" y="306" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399">BARRIER FUNCTION h(x)</text>
  <text x="630" y="330" font-family="monospace" font-size="15" font-weight="800" fill="#10b981">h₁(x) = +0.842  [SAFE ✅]</text>

  <!-- Metric Card 4: Solve Time -->
  <rect x="618" y="356" width="244" height="88" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="630" y="376" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">QP SOLVER LATENCY</text>
  <text x="630" y="400" font-family="monospace" font-size="16" font-weight="800" fill="#fbbf24">t_solve = 0.082 ms</text>
  <text x="630" y="426" font-family="sans-serif" font-size="11" font-weight="700" fill="#a1a1aa">Throughput: &gt;12,000 Hz</text>

</svg>
